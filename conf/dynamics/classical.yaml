# @package _global_

# Classical dynamical model for Triton state estimation.
# Propagates Triton around Neptune within a full planetary system.

# Frame settings
global_frame_origin: "SSB"
global_frame_orientation: "J2000"

propagation:
  set_integrated_result: true
  interpolator_order: 12

integrator:
  type: "BulirschStoer"
  fixed_step_size: 60000
  maximum_number_of_steps: 8

# Environment settings
use_default_body_settings: true
bodies_to_propagate:
  Triton:
    initial_state: null
    central_body: "Neptune"

bodies_to_create:
  Neptune:
    gravity: "Jacobson2009"
    rotation_model:
      type: "IAU2015"
  Triton:
    placeholder: True
    ephemeris:
      type: "interpolated_spice"
      interpolator_cadance: 7200
      coverage_buffer: 8640000
  Sun:
    gravity: "central"
  Jupiter:
    gravity: "central"
  Saturn:
    gravity: "central"
  Uranus:
    gravity: "central"
  Mercury:
    gravity: "central"
  Venus:
    gravity: "central"
  Earth:
    gravity: "central"
    ephemeris:
      type: "direct_spice"
    shape_model:
      type: "oblate_spherical_spice"
    rotation_model:
      type: "GCRS_to_ITRS"
      nutation_model: "iau_2006"
  Mars:
    gravity: "central"
  Triton Spice:
    ephemeris:
      type: "direct_spice"
      use_body_name: "Triton"
      relative_to: "Neptune"
  Neptune Barycenter:
    ephemeris:
      type: "direct_spice"
