# @package _global_

# Experiment: Triton State Estimation using only classical data
# estimating:
# - Triton initial state

defaults:
  - /data: classical_voyager_gaia
  - /parameters: initial_state
  - /logging: default
  - /outlier_rejection: per_set_thresholds
  - /weighting: voyager_fixed_gaia_archive
  - _self_ # Apply experiment config fields after collections
  - /figures/prefit_residuals_spice@figures.prefit_residuals_spice
  - /figures/prefit_residuals_spice_scan@figures.prefit_residuals_spice_scan
  - /figures/prefit_residuals_prop@figures.prefit_residuals_prop
  - /figures/prefit_residuals_prop_scan@figures.prefit_residuals_prop_scan
  - /figures/postfit_residuals@figures.postfit_residuals
  - /figures/postfit_residuals_scan@figures.postfit_residuals_scan
  - /figures/prefit_normalized_residuals@figures.prefit_normalized_residuals
  - /figures/postfit_normalized_residuals@figures.postfit_normalized_residuals
  - /figures/prefit_normalized_residuals_scan@figures.prefit_normalized_residuals_scan
  - /figures/postfit_normalized_residuals_scan@figures.postfit_normalized_residuals_scan
  - /figures/residual_histogram
  - /figures/residual_qq
  - /figures/residual_scatter
  - /figures/parameter_correlation_heatmap
  - /figures/parameter_history_per_iteration
  - /figures/covariance_ellipses
  - /figures/RSW_distance
  - /figures/prefit_rsw
  - /figures/postfit_rsw
  - /figures/propagated_formal_errors_cartesian
  - /figures/propagated_formal_errors_rsw
  - /figures/RSW_distance_with_uncertainty
seed: 42

# Hydra settings
hydra:
  run:
    dir: results/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false

# Time settings
start_date: 1975-1-1T12:00:00
end_date: 2025-1-1T12:00:00
initial_epoch: 1989-08-25 09:10:56.182745873928070 # Voyager 2 closest approach to Triton (TDB epoch)
