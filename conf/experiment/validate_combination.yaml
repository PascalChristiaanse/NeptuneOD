# @package _global_

# Experiment: final validation of one integrator + propagator combination
# against a trusted reference combination.
#
# Both propagations share the same dynamical model and the same initial state;
# only the integrator (type + timestep) and the propagator formulation differ.
# The position/velocity difference between the two state histories is the
# validation result.
#
# Run with:
#   python scripts/validate_combination.py
#
# Override either combination on the command line, e.g.:
#   python scripts/validate_combination.py \
#       integrator.type=RKF108 integrator.fixed_step_size=7200 \
#       reference_integrator.type=RKF1412

defaults:
  - /dynamics: jacobson2009
  - /kernels: classical
  - /logging: default
  - _self_
  - /figures/combination_comparison

use_default_kernels: true

seed: 42

hydra:
  run:
    dir: results/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false

# Time settings — the full validation arc.
start_date: 1989-08-25T12:00:00
end_date: 2025-1-31T12:00:00
initial_epoch: 1989-08-25T12:00:00

# --- Combination under test -------------------------------------------------
# `integrator.fixed_step_size` is the test timestep. The defaults mirror the
# production configuration (`conf/dynamics/classical.yaml`: RKF78 @ 3600 s).
integrator:
  type: "BulirschStoer"
  maximum_number_of_steps: 8
  fixed_step_size: 72000

# --- Reference combination ---------------------------------------------------
reference_integrator:
  # High-order integrator at a small step: the reference must be far more
  # accurate than the test combination, otherwise the reported difference is
  # limited by the reference rather than by the test run.
  #
  # RKF1412 @ 900 s is commensurate with the 3600 s test step, so every
  # compared epoch is exact. Its own error was measured directly by refining
  # it to 225 s over a 2-year arc: the two runs differed by 0.05 m RMS /
  # 0.11 m max, which bounds this reference's error there. Extrapolated to the
  # full 36-year arc (even at a pessimistic quadratic growth) that stays four
  # orders of magnitude below the 14 km target.
  type: "RKF1412"
  fixed_step_size: 3600

validation:
  propagator: "cowell"
  reference_propagator: "cowell"
  # Epochs dropped at each end of the compared series (avoids boundary effects
  # and the start-up transient of the coarser integrator).
  buffer: 2000
  # Lagrange order used only for epochs that are not shared by both histories.
  # 3600 s and 900 s are exactly commensurate, so no interpolation is needed at
  # all and every compared epoch is exact.
  interpolator_order: 12
  # Persist the raw compared time series next to the figure.
  save_npz: true