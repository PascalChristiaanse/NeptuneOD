# @package _global_

# Experiment: Interpolator validation via Richardson extrapolation.
# Propagates Triton with a very fine reference timestep, downsamples to
# Δt and Δt/2, creates tudatpy interpolators, and compares the interpolated
# values at the reference epochs.

defaults:
  - /dynamics: validation_integrator
  - /kernels: classical
  - /logging: default
  - _self_

seed: 42
use_default_body_settings: true
hydra:
  run:
    dir: results/${hydra.job.name}/${git_commit:}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false

# Time settings — configurable via override
start_date: 1989-08-25T12:00:00
end_date: 2025-1-31T12:00:00
initial_epoch: 1989-08-25T12:00:00

# Validation settings
validation:
  # Timestep to investigate (seconds). Overridden by sweep.
  timestep: 3600
  # Reference trajectory timestep (RKF78, 1800 s)
  reference_timestep: 1800
  # Reference Lagrange interpolator order
  reference_lagrange_order: 8
  # Test Lagrange interpolator order (overridden by sweep)
  lagrange_order: 4
  # Buffer: duration to skip at each boundary to avoid Runge's phenomenon.
  # Accepts a duration string (e.g. "6 months", "180 days", "1 year") or a
  # plain number of seconds. The first and last `buffer` worth of epochs are
  # excluded from comparison. The effective skip is floored at
  # ceil(max(lagrange_order)/2) test samples, since a Lagrange-N interpolator
  # needs N/2 samples on each side of a query point.
  buffer: 6 months
  # Whether to save the full state history
  save_full_history: true