# @package _global_

# Figure preset for the final integrator+propagator combination validation.
# Composed as `- /figures/combination_comparison` (keys land at the top level).

combination_comparison:
  output_file: "combination_comparison.pdf"
  figure:
    width: 16.54
    height: 12.0
  titles:
    suptitle: "Combination validation — {test} vs reference {reference}"
    position: "Position difference over time"
    rsw: "Position difference in the RSW frame"
    velocity: "Velocity difference over time"
    radial: "Radial (R)"
    along_track: "Along-track (S)"
    cross_track: "Cross-track (W)"
  axes:
    x_label: "Epoch"
    y_label_pos: "||Δr|| [m]"
    y_label_rsw: "Δ component [m]"
    y_label_vel: "||Δv|| [m/s]"
    hover_x_label: "Epoch"
    hover_y_label_pos: "||Δr|| [m]"
    hover_y_label_rsw: "Δ [m]"
    hover_y_label_vel: "||Δv|| [m/s]"
    # symlog threshold for the RSW panel. Left unset, it is derived from the
    # data (peak / 100) so sub-metre structure stays visible; set a number to
    # pin it.
    symlog_linthresh: null
  # Horizontal reference line on the error (y) axis. Default 14 km = one
  # tenth of Gaia's estimated resolution of Triton (~140 km).
  reference_line:
    enabled: true
    value: 14000.0  # [m]
    label: "Gaia resolution / 10 (14 km)"
    color: "red"
    linestyle: "--"
    linewidth: 1.5