output_file: "gaia_transit_error_components.pdf"
# Epoch gap (seconds) above which a new transit starts. Within a transit the
# samples span tens of seconds; successive transits are >= ~106 min apart.
transit_gap_seconds: 1800.0
figure:
  width: 16.54
  height: 8.27
titles:
  suptitle: "Gaia Transit Error Components (scan frame)"
axes:
  x_label: "Epoch [Date TDB]"
  unit: "mas"   # Display unit: "arcsec" or "mas"
  hover_x_label: "Epoch [Date TDB]"
  hover_y_label: "Residual [mas]"
styling:
  cmap: "tab10"
  marker_size: 30
legend:
  ncols: 2
  bbox_to_anchor:
    x: 0.5
    y: -0.15
