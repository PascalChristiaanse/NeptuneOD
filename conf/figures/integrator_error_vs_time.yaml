# @package _global_

integrator_error_vs_time:
  output_file: "integrator_error_vs_time.pdf"
  figure:
    width: 8
    height: 6
  titles:
    suptitle: "Max Error vs Integration Time — {integrator_type} ({strategy})"
    title: "Max Error vs Integration Time — {integrator_type} ({strategy})"
  axes:
    x_label: "Integration Time [s]"
    y_label: "Max ||Δr|| [m]"
    hover_x_label: "Time [s]"
    hover_y_label: "Max ||Δr|| [m]"
  # Horizontal reference line on the error (y) axis. Default 14 km = one
  # tenth of Gaia's estimated resolution of Triton (~140 km).
  reference_line:
    enabled: true
    value: 14000.0  # [m]
    label: "Gaia resolution / 10 (14 km)"
    color: "red"
    linestyle: "--"
    linewidth: 1.5