# @package _global_

interpolator_family_comparison:
  output_file: "interpolator_family_comparison.pdf"
  figure:
    width: 12
    height: 8
  titles:
    suptitle: "Interpolator Family Comparison"
    title: "Interpolator Family Comparison"
  axes:
    x_label: "Timestep Δt [s]"
    y_label: "||Δr|| [m]"
    hover_x_label: "Timestep [s]"
    hover_y_label: "||Δr|| [m]"
  # Horizontal reference line on the error (y) axis. Default 14 km = one
  # tenth of Gaia's estimated resolution of Triton (~140 km).
  reference_line:
    enabled: true
    value: 14000.0  # [m]
    label: "Gaia resolution / 10 (14 km)"
    color: "red"
    linestyle: "--"
    linewidth: 1.5