output_file: "postfit_normalized_residuals.pdf"
figure:
  width: 16.54
  height: 8.27
# Normalization source: "weights" (applied weight matrix) or "archive" (Gaia
# errors).  "weights" works for every weighted set and is the only meaningful
# choice here: Gaia residuals are excluded from this figure because they are not
# meaningful without the scan-frame rotation (see NormalizedResidualScan).
normalization: "weights"
titles:
  ra: "Right Ascension"
  dec: "Declination"
  suptitle: "Normalized Residuals for {target_name}"
axes:
  x_label: "Epoch [Date TDB]"
  y_label: "Normalized residual [$\\sigma$]"
  hover_x_label: "Epoch [Date TDB]"
  hover_y_label: "Normalized residual [$\\sigma$]"
styling:
  cmap: "tab10"
  marker_size: 30
legend:
  ncols: 2
  bbox_to_anchor:
    x: 0.5
    y: -0.15
