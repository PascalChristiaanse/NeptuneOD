output_file: "prefit_residuals_prop.pdf"
figure:
  width: 16.54
  height: 8.27
titles:
  ra: "Right Ascension"
  dec: "Declination"
  suptitle: "Pre-Fit Residuals for {target_name} with respect to propagation"
axes:
  x_label: "Epoch [Date TDB]"
  y_label: "Residual [arcsec]"
  unit: "arcsec"   # Display unit for residuals: "arcsec" or "mas"
  hover_x_label: "Epoch [Date TDB]"
  hover_y_label: "Residual [arcsec]"
styling:
  cmap: "tab10"
  marker_size: 30
legend:
  ncols: 2
  bbox_to_anchor:
    x: 0.5
    y: -0.15