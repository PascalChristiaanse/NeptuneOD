residual_scatter_ellipses:
  output_file: "residual_scatter_ellipses.pdf"
  figure:
    width: 8.27
    height: 8.27
  titles:
    title: "RA vs DEC Residuals for {target_name} with transit uncertainty ellipses"
  axes:
    x_label: "RA Residual [arcsec]"
    y_label: "DEC Residual [arcsec]"
    colorbar_label: "Epoch"
    hover_x_label: "RA Residual [arcsec]"
    hover_y_label: "DEC Residual [arcsec]"
  styling:
    cmap: "rainbow"
    marker_size: 30
  ellipses:
    # Number of sigmas for the per-transit mean-covariance ellipse.
    n_sigma: 3.0
    color: "black"
    alpha: 0.6
    # Light, semi-transparent fill so overlapping ellipses stay readable.
    facecolor: "steelblue"
    face_alpha: 0.15
    linewidth: 1.0
    # Transits with fewer CCD crossings than this are not drawn.
    min_obs_per_transit: 2
    # Safety cap on the number of ellipses drawn (avoids an unreadable figure).
    max_ellipses: 5
  legend:
    ncols: 2
    bbox_to_anchor:
      x: 0.5
      y: -0.15
