# Wrapped under ``residuals:`` because experiments include this file with a
# bare ``- /figures/residuals`` (no ``@`` package override). The plotter looks
# its styling up under ``cfg.figures.<figure_name>``, so the wrapper key is what
# makes the bare include land in the right place. Sibling configs such as
# ``residual_histogram.yaml`` follow the same convention.
residuals:
  output_file: "residuals.pdf"
  figure:
    width: 16.54
    height: 8.27
  titles:
    ra: "Right Ascension"
    dec: "Declination"
    suptitle: "Residuals for {target_name}"
  axes:
    x_label: "Epoch [Date TDB]"
    y_label: "Residual [arcsec]"
    unit: "arcsec"   # Display unit for residuals: "arcsec" or "mas"
    hover_x_label: "Epoch [Date TDB]"
    hover_y_label: "Residual [arcsec]"
  styling:
    cmap: "tab10"
    marker_size: 30
  legend:
    ncols: 2
    bbox_to_anchor:
      x: 0.5
      y: -0.15
