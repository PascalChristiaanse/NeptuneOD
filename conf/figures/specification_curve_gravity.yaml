# Figure: specification curve of the gravity parameter-combination sweep.
#
# The top panel is the truth table (a dot where a parameter is estimated), the
# bottom panel the residual RMS of the same fit, sorted so the curve is
# monotone.  Fits that did not converge are kept and marked, because which
# combinations fail is itself a result.
#
# ``neptune_j2_j4`` is one column: the two coefficients are estimated in one
# block, so they are one specification, not two independent switches.

plotter: "SpecificationCurve"
output_file: "specification_curve_gravity.pdf"

specification_columns:
  - "neptune_GM"
  - "triton_GM"
  - "neptune_j2_j4"
outcome_column: "rms"
converged_column: "converged"
sort: "ascending"
marker_size: 28

labels:
  neptune_GM: "$GM_{\\mathrm{N}}$"
  triton_GM: "$GM_{\\mathrm{T}}$"
  neptune_j2_j4: "$J_2, J_4$"

figure:
  width: 8.27
  height: 5.0

styling:
  palette: "okabe_ito"

titles:
  suptitle: "Gravity and extended-gravity parameter combinations"
  matrix: "Estimated parameters"
  outcome: "Residual RMS"

axes:
  outcome_label: "RMS residual [m]"
  # A few fits are far worse than the rest and would flatten the comparison, so
  # the axis is cut at 500 m and those fits are marked with a caret instead.
  outcome_clip: 500.0
  outcome_annotate_max: true
