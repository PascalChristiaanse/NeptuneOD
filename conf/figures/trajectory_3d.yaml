plotter: "StateHistory3D"
output_file: "trajectory_3d.pdf"
equal_aspect: true
figure:
  width: 10
  height: 8
titles:
  suptitle: "Propagated Triton Trajectory (J2000, SSB origin)"
axes:
  x_label: "x [m]"
  y_label: "y [m]"
  z_label: "z [m]"
line:
  color: "tab:blue"
  width: 1.5
markers:
  enabled: true
  start: "o"
  end: "s"
  size: 40
