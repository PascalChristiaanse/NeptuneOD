plotter: "RSWDistanceComparison"
# Index into each result's ordered dependent variables.  Index 2 is
# relative_position(Triton Spice, Triton) in the order declared in
# conf/chapter_3/prefit_propagation.yaml.
dependent_variable_index: 2
output_file: "trajectory_rsw_comparison.pdf"
central_body: "Neptune"
# One legend entry per entry in cfg.simulation_results, in the same order.
labels:
  - "Jacobson (2009) pole"
  - "IAU 2015 pole"
figure:
  paper_size: half_height
# Line colours, cycled across the series.  Okabe-Ito is the standard
# colourblind-safe palette; its first two colours (blue and vermillion) are the
# canonical two-series pair, distinguishable under all common forms of colour
# vision deficiency.  Available: okabe_ito, tol_bright, tol_muted, tab10, black.
styling:
  palette: "tol_bright"
# The legend is drawn inside one panel, so it cannot clip the x-axis labels.
legend:
  panel: "top_right"    # top_left | top_right | bottom_left | bottom_right
  corner: "top_right"   # corner of that panel to anchor to
  frameon: true
  framealpha: 0.6       # semi-transparent, so curves behind stay visible
titles:
  r: "Radial (R)"
  s: "Transverse (S)"
  w: "Cross-track (W)"
  norm: "L2 Norm of RSW"
  suptitle: "RSW Separation of {body1} w.r.t. {body2} (centered on {central_body})"
axes:
  x_label: "Epoch"
  # Display unit for the RSW components: "m" or "km".
  unit: "km"
  y_label: "Distance [km]"
  hover_x_label: "Epoch"
  hover_y_label: "Distance [km]"
