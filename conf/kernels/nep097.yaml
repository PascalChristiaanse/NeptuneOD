# @package _global_

# Kernel and data file settings for the classical (non-Voyager) experiments.

kernel_folder: "data/kernels"
use_default_kernels: false

kernels:
  pck00010.tpc: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00010.tpc"
  gm_de440.tpc: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/gm_de440.tpc"
  naif0012.tls: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls"
  de440.bsp: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440.bsp" # BARYCENTERS
  inpop19a_TDB_m1000_p1000_spice.bsp: "" # Sun, Moon, Earth, Pluto
  mar099.bsp: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/mar099.bsp" # MARS and satellites
  jup349.bsp: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/jup349.bsp" # Jupiter and some satellites
  sat459.bsp: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/sat459.bsp" # Saturn and some satellites
  ura184_part-3.bsp: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/ura184_part-3.bsp" # Uranus and some satellites
  nep097.bsp: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/nep097.bsp"
  
kernel_sets:
  inpop19a:
    url: "https://ftp.imcce.fr/pub/ephem/planets/inpop19a/inpop19a_TDB_m1000_p1000_spice.tar.gz"
    archive: "inpop19a_TDB_m1000_p1000_spice.tar.gz"
    archive_type: "tar"
    
# Data files settings
data_folder: "data/other"
data_files:
  observatories.txt: "https://www.projectpluto.com/mpc_stat.txt"