# @package _global_

# Outlier rejection: group-scoped strategies.
#
# Different strategies are applied to different observation groups -- not just
# different sets.  The `groups` filter matches a group's short name (a section
# name or a timeframe id) using this subsystem's OWN grouping config, which is
# independent of the weighting grouping.
#
# Here:
#   - Voyager 2 pre-encounter: a tight maximum residual threshold
#   - Voyager 2 post-encounter: a looser maximum threshold
#   - ground-based observatories: a standard threshold (no `sets`/`groups`
#     filter => applies to every set that reaches it)
#
# NOTE: an `isolation_forest` strategy is planned for NSDB data but is NOT yet
# implemented; the entry is left commented so the config stays runnable.

outlier_rejection:
  enabled: true
  grouping:
    levels:
      - type: section
        sections:
          - {name: "pre_encounter",  start: -1e30,       end: -326688543.8172541}
          - {name: "post_encounter", start: -326688543.8172541, end: 1e30}
  strategies:
    # Voyager 2, split by encounter section.
    - type: residual_threshold
      threshold_arcsec: 0.5
      sets: ["Voyager 2"]
      groups: ["pre_encounter"]
    - type: residual_threshold
      threshold_arcsec: 2.0
      sets: ["Voyager 2"]
      groups: ["post_encounter"]

    # NSDB / ground-based: standard maximum threshold.
    - type: residual_threshold
      threshold_arcsec: 1.5

    # Planned (not implemented yet):
    # - type: isolation_forest
    #   sets: ["689", "675", "675"]
