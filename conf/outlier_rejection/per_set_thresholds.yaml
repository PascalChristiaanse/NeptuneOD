# @package _global_

# Outlier rejection: per-set residual thresholds.
# Uses a tighter threshold for Voyager 2 spacecraft data (0.5 arcsec)
# and a standard threshold for ground-based observatories (1.5 arcsec).
#
# Set identifiers are:
#   - Observatory codes (e.g. "689") for ground stations
#   - Body names (e.g. "Voyager 2") for spacecraft

outlier_rejection:
  enabled: true
  strategies:
    - type: residual_threshold
      threshold_arcsec: 0.5
      sets: ["Voyager 2"]
    - type: residual_threshold
      threshold_arcsec: 1.5