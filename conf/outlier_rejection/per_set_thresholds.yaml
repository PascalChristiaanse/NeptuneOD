# @package _global_

# Outlier rejection: per-set residual thresholds.
# Uses a tighter threshold for Voyager 2 spacecraft data (5 arcsec)
# and a standard threshold for ground-based observatories (1.5 arcsec).
#
# `select` is a pandas query over the standard observation frame, so a strategy
# can be scoped by any column.  `observatory_code` holds the MPC code for ground
# stations and the body name for spacecraft.
#
# `epochs_to_remove` are matched to the nearest observation within
# `tolerance_seconds` (default 1 ms), so a value copied from a log does not have
# to be bit-identical to the float Tudat holds.  The actual difference is logged
# as a warning whenever the tolerance is doing real work.

outlier_rejection:
  enabled: true
  strategies:
    - type: residual_threshold
      threshold_arcsec: 5
      select: "observatory_code == 'Voyager 2'"
    - type: residual_threshold
      threshold_arcsec: 1.5
    - type: epoch_filter
      epochs_to_remove:
        - -1162202738.851084
      select: "observatory_code == '083'"