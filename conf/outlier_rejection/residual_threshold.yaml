# @package _global_

# Outlier rejection: residual threshold (default).
# Removes observations whose RA or DEC residual exceeds 1.5 arcsec.
#
# To apply different thresholds to specific observations, add a `select` query
# over the standard observation frame.  `observatory_code` holds the MPC code
# for ground stations and the body name for spacecraft.
#
# Example:
#   strategies:
#     - type: residual_threshold
#       threshold_arcsec: 1.5
#       select: "observatory_code in ['689', '675']"
#     - type: residual_threshold
#       threshold_arcsec: 0.5
#       select: "observatory_code == 'Voyager 2'"

outlier_rejection:
  enabled: true
  strategies:
    - type: residual_threshold
      threshold_arcsec: 1.5