# @package _global_

# Estimation settings: Triton initial state + Neptune J2 and J4.
# Both cosine coefficients are estimated in a single spherical-harmonic block.
# The two single-coefficient keys cannot be enabled together (they share one
# TudatPy parameter identifier); this set is the supported way to estimate both.
estimation:
  max_iterations: 5
  max_iterations_without_improvement: 3
  parameters_to_estimate:
    initial_state: true
    neptune_j2_j4: true
