# @package _global_

# Estimation settings: Triton initial state + Neptune J4 only.
# The J2 coefficient is held at its a priori value, so this isolates the
# higher-order term from the oblateness one.
estimation:
  max_iterations: 5
  max_iterations_without_improvement: 3
  parameters_to_estimate:
    initial_state: true
    neptune_j4: true
