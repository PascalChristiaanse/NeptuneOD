# @package _global_

# Config for ``scripts/plot_residuals_figure.py``.
#
# The script draws exactly one residual figure per run.  Which figure, and which
# artifacts to read, are passed as overrides by the Snakemake rules:
#
#     python scripts/plot_residuals_figure.py \
#         figure=residual_scatter \
#         observations=results/.../observations.tudat \
#         standard_frame=results/.../standard_frame.parquet
#
# The defaults below let it run with no arguments at all, against the artifacts
# the toy ``prefit_residuals`` stage writes.
#
# The figure's own styling lives in ``conf/figures/<figure>.yaml`` and is
# composed in by the rule that draws it, not here.

defaults:
  - /logging: default
  - _self_

seed: 42

# Whether to open the figure interactively after writing it.  Left unset, the
# script decides: it shows the figure only when the run is interactive, so a
# Snakemake job (whose stdout is redirected to its log) never blocks on
# plt.show().  Set true to always show, false to never show.
# figure_show: false

# Which figure to draw.  Must be a key of ``FIGURE_BUILDERS`` in
# ``scripts/plot_residuals_figure.py``.
figure: "prefit_residuals_spice"

# The figure's own styling file.  Merged into ``cfg.figures.<figure>`` by the
# script, so each figure's config stays next to the rule that draws it.
figure_config: "conf/figures/prefit_residuals_spice.yaml"

# Artifacts to read.  Both are written by the ``prefit_residuals`` stage.
observations: "results/pipeline/prefit_residuals_toy/prefit_residuals/observations.tudat"
standard_frame: "results/pipeline/prefit_residuals_toy/prefit_residuals/standard_frame.parquet"

# Hydra settings
hydra:
  run:
    dir: results/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
