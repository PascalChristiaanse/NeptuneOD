# @package _global_

# Config for ``scripts/plot_sweep_figure.py``.
#
# The script draws exactly one specification curve per run from the comparison
# table of a parameter-combination sweep.  Which figure, and which table to read,
# are passed as overrides by the Snakemake rules:
#
#     python scripts/plot_sweep_figure.py \
#         figure_config=conf/figures/specification_curve_gravity.yaml \
#         sweep_table=results/.../gravity/gravity_sweep_comparison.csv
#
# The figure's name is the stem of ``figure_config``, so there is no separate
# ``figure`` key to keep in sync.

defaults:
  - /logging: default
  - _self_

seed: 42

# Whether to open the figure interactively after writing it.  Left unset, the
# script decides: it shows the figure only when the run is interactive, so a
# Snakemake job (whose stdout is redirected to its log) never blocks on
# plt.show().  Set true to always show, false to never show.
# figure_show: false

# The figure's own config file.  Its stem is the figure's name, and it carries
# the plotter, the styling and the truth-table columns.
figure_config: "conf/figures/specification_curve_gravity.yaml"

# The comparison table to read.  Written by the sweep analysis stage.
sweep_table: "results/chapter_3/parameter_sweeps/gravity/gravity_sweep_comparison.csv"

# Columns of the table that hold booleans.  A CSV round-trip turns them into
# strings, so they are converted back before the truth table is drawn.
boolean_columns:
  - "neptune_GM"
  - "triton_GM"
  - "neptune_j2_j4"
  - "iau_rotation_model_pole"
  - "iau_rotation_model_pole_rate"
  - "iau_rotation_model_pole_librations_order1"
  - "iau_rotation_model_pole_librations_order2"
  - "converged"

# Hydra settings
hydra:
  run:
    dir: results/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
