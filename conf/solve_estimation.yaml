# @package _global_

# Estimation config for the parameter estimation stage.
#
# This is the config ``scripts/solve_estimation.py`` runs with by default, so the
# stage works with no arguments:
#
#     python scripts/solve_estimation.py
#
# It deliberately composes NO figure configs.  Figures are separate rules with
# their own config files under ``conf/figures/``, so editing a figure title
# cannot invalidate this stage.
#
# It is small on purpose: the light pre-fit dynamical model and the classical
# kernel set.  It exists to make the stage debuggable in seconds, not to
# reproduce a thesis result - the experiments that do that live under
# ``conf/chapter_3/`` and ``conf/experiment/``.

defaults:
  - /dynamics: prefit
  - /kernels: classical
  - /parameters: initial_state
  - /logging: default
  - _self_

seed: 42

# The observation collection this stage estimates from.  It is written by
# ``scripts/generate_observation_collection.py``; Snakemake overrides it with the
# path of the rule's input.  The observation models are rebuilt from the
# collection, so no dataset config is needed here.
observations: "results/prefit_residuals_toy/generate_observation_collection/observations.tudat"

# The estimator's propagator does not need its integrated result: the state
# transition matrices the estimator asks for are produced during the estimation's
# own propagation, not read back from a stored history.
propagation:
  set_integrated_result: false

# Hydra settings
hydra:
  run:
    dir: results/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false

# Time settings — a window that comfortably brackets the nm0017 observations.
start_date: 1985-1-1T12:00:00
end_date: 1995-1-1T12:00:00
initial_epoch: 1989-08-25T12:00:00
