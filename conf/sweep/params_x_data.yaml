# @package _global_

# Sweep: 8 experiments = 6 parameter combos x 2 data variants (with/without Voyager).
# Run with: python scripts/solve_least_squares.py --multirun --config-name sweep/params_x_data

defaults:
  - /experiment: classic_triton_state
  - _self_
  - override /hydra/launcher: submitit_local

hydra:
  mode: MULTIRUN
  launcher:
    submitit_folder: ${hydra.sweep.dir}
    tasks_per_node: 1
    nodes: 1
    gpus_per_node: 0 # set if relevant
    cpus_per_task: 1
    timeout_min: 60
  sweep:
    dir: results/${hydra.job.name}/${git_commit:}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  sweeper:
    max_batch_size: 12
    params:
      parameters: initial_state,state_plus_neptune_GM,state_plus_neptune_GM_rotation,state_plus_neptune_GM_gravity,state_plus_rotation,state_plus_gravity
      data: classical,classical_voyager
