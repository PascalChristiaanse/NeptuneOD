# @package _global_

# Sweep: Integrator validation over multiple timesteps and integrator types.
# Run with:
#   python scripts/validate_integrator.py --multirun --config-name sweep/validate_integrator

defaults:
  - /experiment: validate_integrator
  - _self_
  - override /hydra/launcher: submitit_local

hydra:
  mode: MULTIRUN
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    stderr_to_stdout: false
    tasks_per_node: 1
    nodes: 1
    gpus_per_node: 0
    cpus_per_task: 1
    timeout_min: 240
  sweep:
    dir: results/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  sweeper:
    max_batch_size: 10
    params:
      # Timesteps: 8h, 16h, 24h, 32h, 48h (in seconds)
      validation.timestep: 60000,72000,80000
      # Integrator types to test
      integrator.type: BulirschStoer8,BulirschStoer10
      # Validation strategy
      validation.strategy: richardson