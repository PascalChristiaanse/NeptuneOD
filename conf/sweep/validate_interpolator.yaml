# @package _global_

# Sweep: Interpolator validation over multiple timesteps and Lagrange orders.
# Uses a known-good Lagrange-8 reference interpolator from an RKF78 1800s
# trajectory. Test interpolators are compared against this reference.
# Run with:
#   python scripts/validate_interpolator.py --multirun --config-name sweep/validate_interpolator

defaults:
  - /experiment: validate_interpolator
  - _self_
  - override /hydra/launcher: submitit_local

hydra:
  mode: MULTIRUN
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    stderr_to_stdout: false
    tasks_per_node: 1
    nodes: 1
    gpus_per_node: 0
    cpus_per_task: 1
    timeout_min: 240
  sweep:
    dir: results/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  sweeper:
    max_batch_size: 4
    params:
      # Timesteps: 16h, 18h, 20h, 22h, 24h (in seconds)
      validation.timestep: 57600,64800,72000,79200,86400
      # Lagrange orders to test
      validation.lagrange_order: 10,12,14