# @package _global_

# Weighting: Gaia archive full transit matrix (others -> ID v2).
#
# The Gaia set is routed to the archive strategy, which preserves the full
# off-diagonal transit matrix; other sets use ID v2.

weighting:
  enabled: true
  min_sigma_arcsec: 0.005
  default:
    strategy:
      type: id_v2
  overrides:
    - select: "data_source == 'gaia_archive'"
      strategy:
        type: gaia_archive
        covariance_mode: full_matrix
        scale: 1.0
  clustering:
    levels:
      - type: timeframe
        gap_threshold_hours: 8.0
        min_obs_per_frame: 1
