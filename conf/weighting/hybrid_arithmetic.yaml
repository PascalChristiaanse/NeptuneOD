# @package _global_

# Weighting: scaled hybrid arithmetic ((ID v2 + descaled TF) / 2).
#
# Router-shaped: single-strategy via a router `default`.  Thesis label
# "scaled hybrid arith.".

weighting:
  enabled: true
  min_sigma_arcsec: 0.01
  strategy:
    type: router
    default:
      type: hybrid_arithmetic
  grouping:
    levels:
      - type: timeframe
        gap_threshold_hours: 4.0
        min_obs_per_frame: 1
