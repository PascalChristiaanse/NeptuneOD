# @package _global_

# Weighting: scaled hybrid arithmetic ((ID v2 + descaled TF) / 2).
#
# Thesis label "scaled hybrid arith.".

weighting:
  enabled: true
  min_sigma_arcsec: 0.01
  default:
    strategy:
      type: hybrid_arithmetic
  clustering:
    levels:
      - type: timeframe
        gap_threshold_hours: 4.0
        min_obs_per_frame: 1
