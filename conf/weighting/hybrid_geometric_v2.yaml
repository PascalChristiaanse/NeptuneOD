# @package _global_

# Weighting: scaled hybrid geometric (ID v2 x descaled TF).
#
# Thesis label "scaled hybrid geom." == hybrid_geometric_v2.

weighting:
  enabled: true
  min_sigma_arcsec: 0.005
  default:
    strategy:
      type: hybrid_geometric_v2
  clustering:
    levels:
      - type: timeframe
        gap_threshold_hours: 8.0
        min_obs_per_frame: 1
