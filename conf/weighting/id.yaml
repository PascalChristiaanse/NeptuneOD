# @package _global_

# Weighting: ID (plain per-file RMSE) scheme.
#
# Thesis label "per file" maps here.

weighting:
  enabled: true
  min_sigma_arcsec: 0.01
  default:
    strategy:
      type: id
  clustering:
    levels:
      - type: timeframe
        gap_threshold_hours: 4.0
        min_obs_per_frame: 1
