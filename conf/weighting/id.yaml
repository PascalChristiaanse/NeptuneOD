# @package _global_

# Weighting: ID (plain per-file RMSE) scheme.
#
# Router-shaped: single-strategy via a router `default`.  Thesis label
# "per file" maps here.

weighting:
  enabled: true
  min_sigma_arcsec: 0.01
  strategy:
    type: router
    default:
      type: id
  grouping:
    levels:
      - type: timeframe
        gap_threshold_hours: 4.0
        min_obs_per_frame: 1
