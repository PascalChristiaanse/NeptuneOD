# @package _global_

# Weighting: ID v2 (scaled per-file) scheme.
#
# Router-shaped like every other weighting config: a router with only a
# `default` is the single-strategy case.  Switch schemes by editing `default`;
# add `routes` to give specific sets their own strategy (see `router.yaml`).

weighting:
  enabled: true
  min_sigma_arcsec: 0.005
  strategy:
    type: router
    default:
      type: id_v2
  grouping:
    levels:
      - type: timeframe
        gap_threshold_hours: 8.0
        min_obs_per_frame: 1
