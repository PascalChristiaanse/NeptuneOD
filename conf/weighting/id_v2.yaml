# @package _global_

# Weighting: ID v2 (scaled per-file) scheme.
#
# A plan with only a `default` is the single-strategy case.  Switch schemes by
# editing `default`; add `overrides` to give specific observations their own
# strategy and clustering (see `plan.yaml`).

weighting:
  enabled: true
  min_sigma_arcsec: 0.005
  default:
    strategy:
      type: id_v2
  clustering:
    levels:
      - type: timeframe
        gap_threshold_hours: 8.0
        min_obs_per_frame: 1
