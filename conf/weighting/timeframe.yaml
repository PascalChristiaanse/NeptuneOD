# @package _global_

# Weighting: per-timeframe (TF) with sqrt(n_t) descalement.
#
# Router-shaped: single-strategy via a router `default`.  Thesis label
# "per timeframe".

weighting:
  enabled: true
  min_sigma_arcsec: 0.01
  strategy:
    type: router
    default:
      type: timeframe
  grouping:
    levels:
      - type: timeframe
        gap_threshold_hours: 4.0
        min_obs_per_frame: 1
