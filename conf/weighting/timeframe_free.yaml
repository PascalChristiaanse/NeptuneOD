# @package _global_

# Weighting: per-timeframe free (no sigma floor).
#
# Router-shaped: single-strategy via a router `default`.  Thesis label
# "per timeframe free".  min_sigma_arcsec is ignored by this strategy.

weighting:
  enabled: true
  min_sigma_arcsec: 0.0
  strategy:
    type: router
    default:
      type: timeframe_free
  grouping:
    levels:
      - type: timeframe
        gap_threshold_hours: 4.0
        min_obs_per_frame: 1
