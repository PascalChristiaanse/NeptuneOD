# @package _global_

# Weighting: Voyager 2 fixed pre/post encounter + Gaia fixed 10 mas (others -> ID v2).
#
# Both Voyager 2 and Gaia are routed to `layered` fixed schemes; everything else
# uses ID v2.

weighting:
  enabled: true
  min_sigma_arcsec: 0.005
  default:
    strategy:
      type: id_v2
  overrides:
    - select: "observatory_code == 'Voyager 2'"
      strategy:
        type: layered
        combine: geometric
        layers:
          - level: section
            mode: fixed
            sigmas:
              pre_encounter:  {ra: 1.0, dec: 1.0} # 0.5 sigma
              post_encounter: {ra: 4.0, dec: 4.0} # 2 sigma
      clustering:
        levels:
          - type: section
            sections:
              - {name: "pre_encounter",  start: -1e30,             end: -326688543.8172541}
              - {name: "post_encounter", start: -326688543.8172541, end: 1e30}

    - select: "data_source == 'gaia_archive'"
      strategy:
        type: layered
        combine: geometric
        layers:
          - level: set
            mode: fixed
            sigmas:
              Gaia: {ra: 0.01, dec: 0.01}
      clustering:
        levels:
          - type: set
  clustering:
    levels:
      - type: timeframe
        gap_threshold_hours: 8.0
        min_obs_per_frame: 1
