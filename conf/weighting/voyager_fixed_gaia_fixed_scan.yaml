# @package _global_

# Weighting: Voyager 2 fixed pre/post encounter + Gaia fixed scan sigmas
# (others -> hybrid geom v2).
#
# Voyager 2 -> `layered` (fixed section sigma x timeframe), Gaia -> fixed
# along/across-scan sigmas (5 mas AL / 150 mas AC), everything else -> hybrid
# geometric v2.

weighting:
  enabled: true
  min_sigma_arcsec: 0.005
  default:
    strategy:
      type: hybrid_geometric_v2
  overrides:
    # Gaia: fixed along/across-scan sigmas.
    - select: "data_source == 'gaia_archive'"
      strategy:
        type: fixed_scan
        along_scan_sigma_mas: 5.0
        across_scan_sigma_mas: 150.0

    # Voyager 2: fixed 1" pre / 4" post encounter, clustered by timeframe.
    - select: "observatory_code == 'Voyager 2'"
      strategy:
        type: layered
        combine: geometric
        layers:
          - level: section
            mode: fixed
            sigmas:
              pre_encounter:  {ra: 1.0, dec: 1.0} # 0.5 sigma
              post_encounter: {ra: 4.0, dec: 4.0} # 2 sigma
          # - level: timeframe
          #   mode: rmse_descaled
      clustering:
        levels:
          - type: section
            sections:
              - {name: "pre_encounter",  start: -1e30,             end: -326688543.8172541}
              - {name: "post_encounter", start: -326688543.8172541, end: 1e30}
          - type: timeframe
            gap_threshold_hours: 8.0
            min_obs_per_frame: 1
  clustering:
    levels:
      - type: timeframe
        gap_threshold_hours: 8.0
        min_obs_per_frame: 1
